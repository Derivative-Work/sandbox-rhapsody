[project]
name = "sandbox-rhapsody"
version = "0.1.0"
description = "Analysis and render scripts for the Sandbox Rhapsody music video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "librosa",
    "soundfile",
    "mido",
    "pretty_midi",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=5.0.0.93",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "piano-transcription-inference>=0.0.6",
    "audioread>=3.1.0",
    "music21>=10.5.0",
    "verovio>=6.3.0",
    "cairosvg>=2.9.1",
    "basic-pitch==0.4.0",
    "onnxruntime-gpu>=1.31.0",
    "mir-eval>=0.8.2",
    "resampy==0.4.2",
    "gdown>=6.4.2",
    "pyyaml>=6.0.3",
    "setuptools<81",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]  # renders run on Linux boxes only
# basic-pitch pins TensorFlow, which has no wheels for Python 3.12; this project runs its ONNX model (onnxruntime-gpu)
# instead, so TensorFlow and its TF-only helpers are overridden away.
override-dependencies = [
    "tensorflow ; sys_platform == 'never'",
    "tensorflow-macos ; sys_platform == 'never'",
    "tflite-runtime ; sys_platform == 'never'",
    "coremltools ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]

# CUDA 12.8 PyTorch for the RTX 5090 (Blackwell, sm_120), used for forced alignment (torchaudio MMS_FA).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
