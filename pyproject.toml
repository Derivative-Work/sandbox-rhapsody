[project]
name = "sandbox-rhapsody"
version = "0.1.0"
description = "Analysis and render scripts for the Sandbox Rhapsody music video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "librosa",
    "soundfile",
    "mido",
    "pretty_midi",
    "faster-whisper",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=5.0.0.93",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
